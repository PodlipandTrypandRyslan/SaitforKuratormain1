    function openInNewTab(content, filename, mimeType = 'text/html') {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const win = window.open(url, '_blank');
        if (win) {
            win.focus();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        } else {
            alert('Разрешите всплывающие окна для открытия материалов');
        }
    }

    // Функция для скачивания файла-заглушки .pptx
    function downloadPptx(filename, title) {
        const content = `Этот файл является заглушкой. Оригинальная презентация "${title}" доступна в формате HTML на методическом портале. Для просмотра содержимого откройте HTML-версию презентации.`;
        const blob = new Blob([content], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

            "Правила поведения при атаке БПЛА",
            "ПДД, правила катания на самокатах",
            "ФЗ №124-ФЗ (о комендантском часе)",
            "Правила поведения в общественных местах",
            "Правила пожарной безопасности",
            "Правила перехода через ж/д пути"
        ];
        const rowsCount = 26;
        let html = `<h2>Инструктаж обучающихся учебной группы 23ПЛ-1 (2026 г.)</h2>
        <p><strong>Куратор учебной группы 23ПЛ-1 Е.С. Кутищева</strong> — внесите ФИО и отметки о прохождении инструктажа в соответствующих колонках. Ячейки с темами редактируемые. Первая строка уже содержит фамилию из образца.</p>
        <div style="overflow-x: auto;">
            <table id="editableInstructionTable" style="width:100%; border-collapse: collapse; background:white;">
                <thead><tr>`;
        columns.forEach(col => {
            html += `<th style="border:1px solid #aaa; padding: 10px; background:#f0e8df; text-align:center;">${col}</th>`;
        });
        html += `</thead><tbody>`;
        for (let i = 0; i < rowsCount; i++) {
            html += `<tr>`;
            html += `<td style="border:1px solid #ccc; padding: 8px; text-align:center;">${i+1}</td>`;
            for (let j = 1; j < columns.length; j++) {
                if (i === 0 && j === 1) {
                    html += `<td contenteditable="true" style="border:1px solid #ccc; padding: 8px; min-width: 140px;">Иванов Максим Витальевич</td>`;
                } else {
                    html += `<td contenteditable="true" style="border:1px solid #ccc; padding: 8px; min-width: 120px;" title="Кликните для редактирования"></td>`;
                }
            }
            html += `</tr>`;
        }
        html += `</tbody>
            </table>
        </div>
        <br>
        <div style="display: flex; gap: 15px; justify-content: center; margin: 1rem 0;">
            <button id="saveInstructionExcelBtn" style="background:#2a7f6e; color:white; border:none; padding: 10px 24px; border-radius: 40px; cursor:pointer; font-weight:bold;">📥 Сохранить как Excel (инструктаж 23ПЛ-1)</button>
            <button id="clearInstructionBtn" style="background:#c0a080; color:white; border:none; padding: 10px 24px; border-radius: 40px; cursor:pointer; font-weight:bold;">🗑 Очистить все редактируемые ячейки</button>
        </div>
        <p style="font-size:0.9rem;">* Для заполнения реестра кликайте на ячейки и вносите данные (например, подпись/дата). Сохраните файл на компьютер через кнопку Excel.</p>`;
        const script = `<script>
            (function() {
                const table = document.getElementById('editableInstructionTable');
                const saveBtn = document.getElementById('saveInstructionExcelBtn');
                const clearBtn = document.getElementById('clearInstructionBtn');
                function exportExcel() {
                    let exportHtml = '<html><head><meta charset="UTF-8"><title>Инструктаж_23ПЛ-1</title></head><body>' + table.outerHTML + '</body></html>';
                    const blob = new Blob([exportHtml], { type: 'application/vnd.ms-excel' });
                    const a = document.createElement('a');
                    const url = URL.createObjectURL(blob);
                    a.href = url;
                    a.download = 'instruktazh_23PL-1.xls';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }
                function clearCells() {
                    const tbody = table.tBodies[0];
                    for (let row of tbody.rows) {
                        for (let i = 1; i < row.cells.length; i++) {

                }
                saveBtn.addEventListener('click', exportExcel);
                clearBtn.addEventListener('click', clearCells);
            })();
        <\/script>`;
        return makeHtmlPage("Инструктаж обучающихся учебной группы 23ПЛ-1", html + script);
    }
    
    function getDroneRegisterInteractive() {
        const columns = ["№ п/п", "Фамилия, имя, отчество инструктируемого", "Подпись о прохождении инструктажа"];

        <p><strong>Группа 23ПЛ-1, дата: ___ .12.2025 г. Куратор Е.С. Кутищева</strong> — заполните ФИО и подписи. Сохраните в Excel.</p>
        <div style="overflow-x: auto;"><table id="droneTable" style="width:100%; border-collapse: collapse;"><thead><tr>`;
        columns.forEach(col => { html += `<th style="border:1px solid #aaa; padding:10px; background:#f0e8df;">${col}</th>`; });

        for (let i = 0; i < 30; i++) {
            html += `<tr><td style="border:1px solid #ccc; text-align:center;">${i+1}</td>`;

        }

        <div style="display:flex; gap:15px; justify-content:center; margin:1rem 0;">
            <button id="saveDroneExcelBtn" style="background:#2a7f6e; color:white; border:none; padding:10px 24px; border-radius:40px;">📥 Сохранить как Excel (БПЛА)</button>
            <button id="clearDroneBtn" style="background:#c0a080; color:white; border:none; padding:10px 24px; border-radius:40px;">🗑 Очистить</button>
        </div>`;
        const script = `<script>
            (function(){
                const tbl = document.getElementById('droneTable');
                const save = document.getElementById('saveDroneExcelBtn');
                const clear = document.getElementById('clearDroneBtn');
                save.onclick = ()=>{
                    const blob = new Blob(['<html><meta charset="UTF-8"><body>'+tbl.outerHTML+'</body></html>'], {type:'application/vnd.ms-excel'});
                    const a=document.createElement('a');
                    a.href=URL.createObjectURL(blob);
                    a.download='instruktazh_BPLA.xls';
                    a.click();
                    URL.revokeObjectURL(a.href);
                };
                clear.onclick = ()=>{
                    for(let row of tbl.tBodies[0].rows)
                        for(let i=1;i<row.cells.length;i++) row.cells[i].innerText='';
                };
            })();
        <\/script>`;
        return makeHtmlPage("Инструктаж по БПЛА", html + script);
    }
    
    // ============ ПОСТРОЕНИЕ КАРТОЧЕК С ДОБАВЛЕНИЕМ ССЫЛОК НА ФАЙЛЫ ============
    function createPresentationCard(item) {
        const card = document.createElement('div');
        card.className = 'method-card';
        card.innerHTML = `
            <div class="card-icon">${item.icon}</div>
            <h4>${item.title}</h4>
            <p>${item.desc}</p>
            <a class="file-link" id="download-${item.id}" style="cursor:pointer;">📎 Скачать презентацию (.pptx)</a>
        `;
        // Клик по карточке (но не по ссылке) — открыть HTML-версию
        card.addEventListener('click', (e) => {
            if (e.target.classList.contains('file-link')) return;
            openInNewTab(makeHtmlPage(item.title, item.presentationHtml()), item.title+'.html');
        });
        // Отдельная обработка ссылки на файл
        const downloadLink = card.querySelector(`#download-${item.id}`);
        downloadLink.addEventListener('click', (e) => {
            e.stopPropagation();
            downloadPptx(item.filename, item.title);
        });
        return card;
    }
    
    function createSimpleCard(item) {
        const card = document.createElement('div');
        card.className = 'method-card';
        card.innerHTML = `<div class="card-icon">${item.icon}</div><h4>${item.title}</h4><p>${item.desc}</p>`;
        card.addEventListener('click', () => {
            if (item.contentHtmlFunc) openInNewTab(makeHtmlPage(item.title, item.contentHtmlFunc()), item.title+'.html');
            else if (item.registerFunc) openInNewTab(item.registerFunc(), item.title+'.html');
        });
        return card;
    }
    
    // Данные презентаций с именами файлов для скачивания
    const presentations = [
        { id: "curfew", icon: "🌙", title: "Комендантский час", desc: "ФЗ №124, запреты, штрафы (презентация)", presentationHtml: getCurfewPresentationHtml, filename: "Komendantskiy_chas.pptx" },
        { id: "false_report", icon: "⚠️", title: "Ответственность за ложное сообщение", desc: "Ст.207 УК РФ, общественная опасность", presentationHtml: getFalseReportPresentationHtml, filename: "Otvetstvennost_za_lozhnoe_soobshchenie.ppt" },
        { id: "article207", icon: "⚖️", title: "Ст. 207 УК РФ (полный разбор)", desc: "Части 1-4, размеры наказаний", presentationHtml: getArticle207FullHtml, filename: "Prezentatsiya_po_st_207_UK_RF.pptx" },
        { id: "danger_false", icon: "💣", title: "Чем опасно ложное сообщение", desc: "Последствия «телефонного терроризма»", presentationHtml: getDangerFalseHtml, filename: "Chem_opasno_lozhnoe_soobshchenie.ppt" }
    ];
    
    const safetyCardsList = [
        { icon: "🚁", title: "Памятка при обнаружении БПЛА", desc: "Действия, запреты, номер 112", contentHtmlFunc: getDroneMemoFullHtml },
        { icon: "📚", title: "Подготовка к сессии", desc: "Памятка кураторам, студентам, родителям", contentHtmlFunc: getSessionMemoHtml }
    ];
    
    const registersCards = [
        { icon: "📋", title: "Инструктаж обучающихся учебной группы 23ПЛ-1", desc: "26 строк, 8 тем (вода/лес, БПЛА, ПДД, комендантский час, общественные места, пожарная, ЖД пути) — редактируемый Excel", registerFunc: getInstructionRegisterFromDoc },
        { icon: "📄", title: "Реестр инструктажа по БПЛА", desc: "30 человек, подпись — сохранение в Excel", registerFunc: getDroneRegisterInteractive }
    ];
    
    const presGrid = document.getElementById('presentations-grid');
    const safetyGrid = document.getElementById('safety-grid');
    const regGrid = document.getElementById('registers-grid');
    
    presentations.forEach(p => presGrid.appendChild(createPresentationCard(p)));
    safetyCardsList.forEach(s => safetyGrid.appendChild(createSimpleCard(s)));
    registersCards.forEach(r => regGrid.appendChild(createSimpleCard(r)));
    
    // Анимация появления при скролле
    function isElementInViewport(el, offset = 80) {
        const rect = el.getBoundingClientRect();
        const windowHeight = window.innerHeight || document.documentElement.clientHeight;
        return rect.top < windowHeight - offset && rect.bottom > offset;
    }
    function updateAnimations() {
        document.querySelectorAll('.method-card').forEach(card => {
            const visible = isElementInViewport(card, 90);
            if (visible && !card.classList.contains('animate-in')) card.classList.add('animate-in');
            else if (!visible && card.classList.contains('animate-in')) card.classList.remove('animate-in');
        });
    }
    window.addEventListener('scroll', updateAnimations);
    window.addEventListener('resize', updateAnimations);
    setTimeout(updateAnimations, 100);
    updateAnimations();
</script>
